name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25 · Spring Boot · Flowable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testes unitários + integração com Flowable e PostgreSQL via Testcontainers
      - run: chmod +x mvnw && ./mvnw -B verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build

  compose:
    name: Docker Compose (smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Subir o ambiente completo
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 300
      - name: Verificar serviços
        run: |
          curl -fsS http://localhost:4200/healthz
          curl -fsS http://localhost:8080/actuator/health | grep '"UP"'
          curl -fsS http://localhost:4200/api/process-definitions | grep -q parallelApproval
          curl -fsS http://localhost:4200/api/dashboard/summary
          curl -fsS -o /dev/null http://localhost:4200/swagger-ui/index.html
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Encerrar
        if: always()
        run: docker compose down -v
